when:
  - branch: [main]
    event: push
    path:
      include: ['Website/**']
      on_empty: false

steps:
  - name: log_start_time
    image: alpine
    commands:
      - date -I'seconds'

  - name: build_by_hugo
    image: alpine:3.24 # PaperMod (Stand 2026-05) braucht Hugo >= 0.146; Hugo-Version unten gepinnt
    commands:
      - date -I'seconds'
      - cat /etc/alpine-release
      # Version pinnen: alpine:3.24 fuehrt genau eine Hugo-Version. Ein Alpine-Update
      # wechselt sie sonst unangekuendigt und kann den Build brechen (siehe #848).
      # "~" statt "=": Alpine baut Pakete gelegentlich neu (r2 -> r3, Okt. 2026), ein
      # exakter Pin auf die Revision bricht dann den Build. So bleibt Hugo 0.160.1 fest,
      # die Paketrevision darf wechseln.
      - apk add --no-cache hugo~0.160.1
      - hugo version

      - mkdir Website/PROD
      - hugo -s Website -d PROD --logLevel error
      
      - ls -la Website/PROD/index.html
      - if grep -E "Team vollständig" Website/PROD/index.html; then echo "Fehlerhafte Startseite! Artikel vorhanden..."; else echo "Startseite OK"; fi
      - echo $?
      - grep -E "Du hast sogar schon mal selbst Materialien erstellt" Website/PROD/index.html

  - name: copy_to_server
    image: alpine
    environment:
      SSH_HOST:
        from_secret: ssh_host
      SSH_USER:
        from_secret: ssh_user
      SSH_KEY:
        from_secret: ssh_key
      SSH_PORT:
        from_secret: ssh_port
      DOMAIN_FOLDER:
        from_secret: domain_folder
      TARGET_PATH:
        from_secret: target_path

    commands:
      - apk add --no-cache openssh
      - mkdir -p ~/.ssh
      - echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deployKey
      - chmod 600 ~/.ssh/deployKey
      # Nur den RSA-Hostkey holen (der Server hat keinen anderen). Ohne -t oeffnet
      # ssh-keyscan pro Schluesseltyp eine eigene Verbindung; die scheiternden
      # Negotiations wurden serverseitig als Angriff gewertet und die CI-IP gesperrt (#871).
      - ssh-keyscan -t rsa -p $SSH_PORT $SSH_HOST 2>/dev/null >> ~/.ssh/known_hosts
      - chmod 600 ~/.ssh/known_hosts
      - ssh -4 -o BatchMode=yes -i ~/.ssh/deployKey -p $SSH_PORT $SSH_USER@$SSH_HOST "touch $DOMAIN_FOLDER/Log/time_begin_copy_$(date +'%Y-%m-%d_%T')"
      - scp -4 -o BatchMode=yes -r -i ~/.ssh/deployKey -P $SSH_PORT Website/PROD/* $SSH_USER@$SSH_HOST:$DOMAIN_FOLDER/$TARGET_PATH/
      - if ! grep -E "<p>FOERBICO is a research project which " Website/PROD/en/index.html; then ssh -4 -o BatchMode=yes -i ~/.ssh/deployKey -p $SSH_PORT $SSH_USER@$SSH_HOST "cp $DOMAIN_FOLDER/www_stable/en/index.html $DOMAIN_FOLDER/$TARGET_PATH/en/"; fi

  - name: log_end_time
    image: alpine
    commands:
      - date -I'seconds'
