# Entwurf für einen eigenen Testlauf: nur Verbindung prüfen, nichts kopieren.
# Nach .woodpecker/test_ssh_connection.yaml kopieren und auf einem Testbranch pushen.
# Die Secrets (ssh_host, ssh_user, ssh_key, ssh_port, domain_folder) liegen in Woodpecker
# beim Repo und werden automatisch injiziert. Eigene SSH-Keys sind nicht nötig.
when:
  - event: push
    branch: test-ssh-871          # <- an den eigenen Branchnamen anpassen

steps:
  - name: test_ssh_only
    image: alpine
    environment:
      SSH_HOST:
        from_secret: ssh_host
      SSH_USER:
        from_secret: ssh_user
      SSH_KEY:
        from_secret: ssh_key
      SSH_PORT:
        from_secret: ssh_port
      DOMAIN_FOLDER:
        from_secret: domain_folder
    commands:
      - date -I'seconds'
      - apk add --no-cache openssh
      - mkdir -p ~/.ssh
      - echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deployKey
      - chmod 600 ~/.ssh/deployKey
      # Nur den RSA-Hostkey holen: genau EINE Verbindung, keine scheiternde Negotiation.
      - ssh-keyscan -t rsa -p $SSH_PORT $SSH_HOST 2>/dev/null >> ~/.ssh/known_hosts
      - chmod 600 ~/.ssh/known_hosts
      - wc -l ~/.ssh/known_hosts
      # Ein einziger echter Verbindungsversuch, nur IPv4, ohne Passwort-Nachfrage.
      - ssh -4 -v -o ConnectTimeout=15 -o BatchMode=yes -i ~/.ssh/deployKey -p $SSH_PORT $SSH_USER@$SSH_HOST "echo CONNECTED; touch $DOMAIN_FOLDER/Log/test_ssh_871_$(date +'%Y-%m-%d_%T')"
