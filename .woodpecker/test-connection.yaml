steps:
  - name: intro
    image: alpine
    commands:
      - echo "here i am"

  - name: test_connection
    image: alpine
    environment:
      SSH_HOST:
        from_secret: ssh_host
      SSH_USER:
        from_secret: ssh_user
      SSH_KEY:
        from_secret: ssh_key
      SSH_PORT:
        from_secret: ssh_port

    commands:
      # Netcat
      - apk add --no-cache netcat-openbsd
      - echo "*** Testing port 22"
      - nc -zv $SSH_HOST 22
      - echo "*** Testing SSH header"
      - timeout 5 bash -c 'echo | nc -w 5 $SSH_HOST 22' || echo "No SSH header"
      - echo "*** Testing connection"
      # SSH
      - apk add --no-cache openssh
      - mkdir -p ~/.ssh
      - echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deployKey
      - chmod 600 ~/.ssh/deployKey
      - ssh-keyscan -H -p $SSH_PORT $SSH_HOST 2>/dev/null >> ~/.ssh/known_hosts
      - chmod 600 ~/.ssh/known_hosts
      - echo "*** SSH 1"
      - ssh -vvv -o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deployKey -p $SSH_PORT $SSH_USER@$SSH_HOST "echo 'SSH connection successful'"
      - echo "*** SSH 2"
      - ssh -vvv -i ~/.ssh/deployKey -p $SSH_PORT $SSH_USER@$SSH_HOST "touch $DOMAIN_FOLDER/Log/time_begin_copy_$(date +'%Y-%m-%d_%T')"
      - echo "*** SSH 3 / SCP"
      - scp -r -i ~/.ssh/deployKey -P $SSH_PORT Website/PROD/oer-remix/CC*Chart.jpg $SSH_USER@$SSH_HOST:$DOMAIN_FOLDER/Log/
      - if ! grep -E "<p>FOERBICO is a research project which " Website/PROD/en/index.html; then ssh -i ~/.ssh/deployKey -p $SSH_PORT $SSH_USER@$SSH_HOST "cp $DOMAIN_FOLDER/www_stable/en/index.html $DOMAIN_FOLDER/$TARGET_PATH/en/"; fi
