steps:
  - name: intro
    image: alpine
    commands:
      - echo "here i am"

  - name: test-drone-ssh
    image: appleboy/drone-ssh:1.7.3
    environment:
      DOMAIN_FOLDER:
        from_secret: domain_folder
      TARGET_PATH:
        from_secret: target_path
    settings:
      host:
        from_secret: ssh_host
      username:
        from_secret: ssh_user
      key:
        from_secret: ssh_key
      port:
        from_secret: ssh_port
      envs:
        - DOMAIN_FOLDER
        - TARGET_PATH
      script:
        - ls -la MyLog
        - cat MyLog/*
        - ls -la "$DOMAIN_FOLDER/"
        - ls -la "$DOMAIN_FOLDER/Log/"
        - touch "$DOMAIN_FOLDER/$TARGET_PATH/i-was-here"
