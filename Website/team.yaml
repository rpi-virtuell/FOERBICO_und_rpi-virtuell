title: Unser Team
description: |
  Das FOERBICO-Team an drei Standorten: Comenius-Institut Münster, Goethe-Universität Frankfurt und Friedrich-Alexander-Universität Erlangen-Nürnberg.

  ## Comenius-Institut

  Das Comenius-Institut, Evangelische Arbeitsstätte für Erziehungswissenschaft e.V., fördert Bildung und Erziehung aus evangelischer Verantwortung. Es versteht sich als Wissenschafts-, Kompetenz- und Forschungseinrichtung sowie als Impuls- und Dienstleistungszentrum im Blick auf grundlegende Fragen evangelischen Bildungshandelns.

  Weitere Infos: [Comenius-Institut](https://comenius.de/)

  ## Goethe-Universität Frankfurt

  Die Professur für Religionspädagogik und Mediendidaktik an der Goethe-Universität Frankfurt widmet sich der Erforschung und Lehre der religiösen Bildung in Schulen und anderen Bildungseinrichtungen. Sie kombiniert dabei die traditionellen Ansätze der Religionspädagogik mit modernen Mediendidaktiken, um die Vermittlung religiöser Inhalte in einer digitalisierten Welt zu verbessern.

  Weitere Infos: [Professur für Religionspädagogik und Mediendidaktik](https://www.uni-frankfurt.de/de/fachbereich-7/professuren/mediendidaktik-und-religionspaedagogik) an der Goethe-Universität

  **Prof. Dr. Viera Pirker** forscht und lehrt an der Professur für Religionspädagogik und Mediendidaktik in den Bereichen religiöse Bildung, interreligiöses Lernen sowie Medienbildung und -didaktik.

  **Paula Gregorio Rodrigo** ist wissenschaftliche Mitarbeiterin an der Professur. Ihr Forschungsschwerpunkt liegt im Bereich der digitalen Medienbildung an Schulen; sie unterstützt FOERBICO bei der Vernetzung in der Wissenschaft und in der Planung der Abschlusstagung 2027. Kontakt: [gregoriorodrigo@em.uni-frankfurt.de](mailto:gregoriorodrigo@em.uni-frankfurt.de)

  ## Friedrich-Alexander-Universität Erlangen-Nürnberg

  Der Lehrstuhl für Religionspädagogik und Didaktik des Evangelischen Religionsunterrichts an der FAU beschäftigt sich mit der Theorie und Praxis des evangelischen Religionsunterrichts sowie mit Fragen der religiösen Bildung. Ziel ist es, Studierende auf eine reflektierte und praxisnahe Tätigkeit im Religionsunterricht vorzubereiten und zur Weiterentwicklung dieses Bildungsbereichs beizutragen.

  Weitere Infos: [Lehrstuhl für Religionspädagogik und Didaktik des evangelischen Religionsunterrichts](https://www.evrel.phil.fau.de/) an der FAU

  **Prof. Dr. Manfred Pirner** ist Professor für Religionspädagogik und Didaktik des Evangelischen Religionsunterrichts an der FAU. Seine Forschungsschwerpunkte liegen in der religiösen Bildung, der religiösen Sozialisation und der interkulturellen und interreligiösen Bildung. Kontakt: [manfred.pirner@fau.de](mailto:manfred.pirner@fau.de)
