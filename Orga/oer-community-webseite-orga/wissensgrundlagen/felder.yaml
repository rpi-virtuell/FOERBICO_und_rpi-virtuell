# Feldregeln FOERBICO Blog YAML-Frontmatter
# Definiert Struktur, Pflichtfelder, Standardwerte und Ableitungslogik
# für die drei Blöcke: commonMetadata (OERSI/AMB), staticSiteGenerator (Hugo)
# und bilder (Bildnachweise, seit 2026-09-07).
#
# Bilder: Zielform ist die Blossom-Hash-URL (https://blossom.edufeed.org/<sha256>.<ext>)
# in commonMetadata.image und staticSiteGenerator.cover.image, mit cover.relative: false.
# Die lokale Form (Dateiname im Post-Ordner, relative: true, image unter oer.community)
# bleibt gültig, bis der Beitrag migriert ist. Umschreiben: Website/scripts/md2blossom.mjs.

# ─────────────────────────────────────────────
# BLOCK 1: commonMetadata
# ─────────────────────────────────────────────

commonMetadata:

  context:
    feld: "'@context'"
    pflicht: true
    wert: https://schema.org/
    # Immer dieser feste Wert. Anführungszeichen nötig wegen @ in YAML.

  creativeWorkStatus:
    feld: creativeWorkStatus
    pflicht: true
    erlaubte_werte: [Published, Draft]
    standard: Published

  type:
    feld: type
    pflicht: true
    wert: LearningResource

  name:
    feld: name
    pflicht: true
    ableitung: identisch mit staticSiteGenerator.title

  description:
    feld: description
    pflicht: true
    yaml_stil: ">-"   # Fließtext, kein abschließender Zeilenumbruch
    ableitung: identisch mit staticSiteGenerator.summary

  license:
    feld: license
    pflicht: true
    standard: https://creativecommons.org/licenses/by/4.0/deed.de
    optionen:
      CC0:      https://creativecommons.org/publicdomain/zero/1.0/deed.de
      CC-BY:    https://creativecommons.org/licenses/by/4.0/deed.de
      CC-BY-SA: https://creativecommons.org/licenses/by-sa/4.0/deed.de
      CC-BY-NC: https://creativecommons.org/licenses/by-nc/4.0/deed.de
      CC-BY-NC-SA: https://creativecommons.org/licenses/by-nc-sa/4.0/deed.de

  id:
    feld: id
    pflicht: true
    muster: "https://oer.community/{url}"
    # {url} = Wert von staticSiteGenerator.url

  creator:
    feld: creator
    pflicht: true
    quelle: data/personen.yaml
    # Strukturierte Autorenangaben mit givenName, familyName, type, ggf. id (ORCID) und affiliation

  inLanguage:
    feld: inLanguage
    pflicht: true
    standard: [de]

  image:
    feld: image
    pflicht: true
    muster: "https://blossom.edufeed.org/{sha256}.{ext}"
    # Zielform: Blossom-Hash-URL, identisch mit staticSiteGenerator.cover.image.
    # Der Hash ist der SHA-256 der Bilddatei; der Lizenznachweis (kind:1063) hängt daran.
    muster_lokal: "https://oer.community/{url}/{dateiname}"
    # Bis zur Migration: {url} = staticSiteGenerator.url, {dateiname} = cover.image

  learningResourceType:
    feld: learningResourceType
    pflicht: true
    standard: [https://w3id.org/kim/hcrt/text, https://w3id.org/kim/hcrt/web_page]
    optionen:
      text:         https://w3id.org/kim/hcrt/text
      web_page:     https://w3id.org/kim/hcrt/web_page
      video:        https://w3id.org/kim/hcrt/video
      audio:        https://w3id.org/kim/hcrt/audio
      presentation: https://w3id.org/kim/hcrt/presentation
      image:        https://w3id.org/kim/hcrt/image
      worksheet:    https://w3id.org/kim/hcrt/worksheet
      course:       https://w3id.org/kim/hcrt/course

  educationalLevel:
    feld: educationalLevel
    pflicht: true
    standard: [https://w3id.org/kim/educationalLevel/level_A]
    optionen:
      level_A: https://w3id.org/kim/educationalLevel/level_A   # Allgemein
      level_B: https://w3id.org/kim/educationalLevel/level_B   # Berufsbildung
      level_C: https://w3id.org/kim/educationalLevel/level_C   # Hochschule

  datePublished:
    feld: datePublished
    pflicht: true
    format: "'YYYY-MM-DD'"   # Anführungszeichen sind Pflicht

  keywords:
    feld: keywords
    pflicht: true
    quelle: data/schlagworte.yaml
    ableitung: identisch mit staticSiteGenerator.tags

  about:
    feld: about
    pflicht: false
    # KIM Hochschulfächersystematik
    optionen:
      Allgemeine Pädagogik:       https://w3id.org/kim/hochschulfaechersystematik/n01
      Erziehungswissenschaft:     https://w3id.org/kim/hochschulfaechersystematik/n02
      Psychologie:                https://w3id.org/kim/hochschulfaechersystematik/n03
      Medienpädagogik:            https://w3id.org/kim/hochschulfaechersystematik/n052
      Evangelische Theologie:     https://w3id.org/kim/hochschulfaechersystematik/n053
      Katholische Theologie:      https://w3id.org/kim/hochschulfaechersystematik/n054
      Informatik:                 https://w3id.org/kim/hochschulfaechersystematik/n069
      Kommunikationswissenschaft: https://w3id.org/kim/hochschulfaechersystematik/n079
      Politikwissenschaft:        https://w3id.org/kim/hochschulfaechersystematik/n086
      Informationswissenschaft:   https://w3id.org/kim/hochschulfaechersystematik/n121

# ─────────────────────────────────────────────
# BLOCK 2: staticSiteGenerator
# ─────────────────────────────────────────────

staticSiteGenerator:

  author:
    feld: author
    pflicht: true
    format: "Vorname Nachname"
    ableitung: Vor- und Nachname aus commonMetadata.creator

  title:
    feld: title
    pflicht: true
    ableitung: identisch mit commonMetadata.name

  cover:
    feld: cover
    pflicht: true
    unterfelder:
      relative:
        pflicht: true
        erlaubte_werte: [false, true]
        standard: false
        # false = Blossom-Hash-URL in cover.image (Zielform), Hugo nutzt die URL unverändert
        # true  = Bilddatei liegt im Post-Verzeichnis (lokale Form bis zur Migration)
      image:
        pflicht: true
        format: "https://blossom.edufeed.org/{sha256}.{ext}"
        # Zielform: identisch mit commonMetadata.image.
        format_lokal: "dateiname.ext"
        # Lokale Form: nur Dateiname, kein Pfad – letztes Segment von commonMetadata.image
      alt:
        pflicht: false
        # Bildbeschreibung für Barrierefreiheit, empfohlen
      caption:
        pflicht: false
        # Bildunterschrift, optional
      hiddenInSingle:
        pflicht: true
        standard: true

  summary:
    feld: summary
    pflicht: true
    yaml_stil: ">-"
    ableitung: identisch mit commonMetadata.description

  url:
    feld: url
    pflicht: true
    regeln:
      - Nur Kleinbuchstaben
      - "Leerzeichen → Bindestrich"
      - "ä → ae, ö → oe, ü → ue, ß → ss"
      - "Sonderzeichen entfernen: # ? ! : ' ( )"
      - Maximal 60 Zeichen
    beispiel: "OERcamp #2025 in Hamburg → oercamp-2025-in-hamburg"

  tags:
    feld: tags
    pflicht: true
    quelle: data/schlagworte.yaml
    ableitung: identisch mit commonMetadata.keywords

# ─────────────────────────────────────────────
# BLOCK 3: bilder  (Konvention: bildattribution.md)
# ─────────────────────────────────────────────
# Bildnachweise für Cover und Fließtextbilder. Der Block ist Eingabe zum Prägen:
# mdparser/sync liest ihn und publiziert je Bild ein kind:1063 auf dem Relay;
# das Event auf dem Relay ist die Wahrheit. Ableitbares (sha256, MIME, Größe)
# steht nicht im Block. Markerzeile im Frontmatter:
#   # bilder  (Konvention: bildattribution.md · Schlüssel = Dateiname oder Hash-URL)

bilder:
  schluessel:
    # Dateiname im Post-Ordner (vor der Migration) oder die Blossom-Hash-URL
    format: "dateiname.ext | https://blossom.edufeed.org/{sha256}.{ext}"
  unterfelder:
    alt:
      pflicht: false
      # faktisch Pflicht (Barrierefreiheit): was ist zu sehen
    title:
      pflicht: false
    sourceUrl:
      pflicht: true
      ausnahme: CC0
      # URL der Quellseite; eigene Fotos: der Beitrag selbst
    author:
      pflicht: true
      ausnahme: CC0
      # Footer-Regel oer.community: "FOERBICO", soweit nicht anders angegeben
    authorUrl:
      pflicht: false
    licence:
      pflicht: false
      # Kurzform (CC0, CC BY 4.0, CC BY-SA 4.0); sonst aus licenceUrl abgeleitet
    licenceUrl:
      pflicht: true
      # kanonische Lizenz-URL, z. B. https://creativecommons.org/licenses/by/4.0/
    modification:
      pflicht: false
      # Pflicht bei Bearbeitung von CC-BY-Werken (Zuschnitt, Farbe, Kombination)
    pubkey:
      pflicht: false
      # Nostr-Pubkey der Urheber:in (hex) → p-Tag im 1063
    ai:
      pflicht: false
      werte: [generated, modified]
      # KI-Beteiligung nach edufeed-Wiki license-events-nope (2026-09-10), Werte nach den
      # EU-AI-Office-Icons: generated = vollständig KI-generiert, modified = mit KI bearbeitet.
      # Fehlt = nicht deklariert (nicht "ohne KI"). Anderer Wert → kein ai-Tag, Warnung.
      # Caption: "KI-generiert" / "KI-verändert" direkt hinter der Lizenz (bildattribution.md, Regel 8).

# ─────────────────────────────────────────────
# ABLEITUNGSREGELN (Zusammenfassung)
# ─────────────────────────────────────────────

ableitungen:
  - commonMetadata.name          == staticSiteGenerator.title
  - commonMetadata.description   == staticSiteGenerator.summary
  - commonMetadata.keywords      == staticSiteGenerator.tags
  - commonMetadata.id            == "https://oer.community/" + staticSiteGenerator.url
  - commonMetadata.image         == staticSiteGenerator.cover.image                      # Blossom-Form (relative: false)
  - commonMetadata.image         == "https://oer.community/" + staticSiteGenerator.url + "/" + staticSiteGenerator.cover.image   # lokale Form (relative: true)
  - commonMetadata.creator[].givenName + " " + familyName == staticSiteGenerator.author[]
